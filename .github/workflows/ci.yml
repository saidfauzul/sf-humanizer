name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev tools
        run: pip install ruff pytest
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: Validate repository
        run: python tools/validate.py
