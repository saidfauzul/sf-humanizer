name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev tools
        run: pip install ruff pytest
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: Build ZIP
        run: python tools/package.py --tag "$GITHUB_REF_NAME"
      - name: Write release notes
        run: python tools/package.py --notes "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip --notes-file release-notes.md $flags
